<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>チェックリスト</title>
    <!-- ブラウザの UI の色。ライトは --background（白）、ダークは --background（oklch(0.145 0 0) ≒ #0a0a0a）（仕様書 7 章） -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>
      // 初回描画のちらつきを防ぐため、React の起動前にテーマを決める（画面設計書 7.3 節）。
      // 判定は src/domain/settings.ts の readSettings / resolveTheme と同じにする（データ設計書 6 章）。
      // 変えるときは src/app/themeInit.test.ts が両者の一致を確かめる
      (() => {
        let theme = "system";
        try {
          const value = JSON.parse(localStorage.getItem("checklist.settings"));
          if (value && value.version === 1 && (value.theme === "light" || value.theme === "dark")) {
            theme = value.theme;
          }
        } catch {
          // 解析できない、localStorage が使えない → 既定値（OS に合わせる）
        }
        let prefersDark = false;
        try {
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {
          // matchMedia がない環境ではライト
        }
        if (theme === "dark" || (theme === "system" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
