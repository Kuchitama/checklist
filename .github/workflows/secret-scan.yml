name: Secret scan

# 秘密情報の混入を検出する（docs/security.md）。
# push / pull_request では gitleaks-action が base..head の変更範囲だけを検査し、
# schedule / workflow_dispatch では全履歴を検査する。fetch-depth: 0 は後者と範囲計算のために必要。
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # 毎日 04:17 UTC。全履歴を最新ルールで再検査する

permissions:
  contents: read
  pull-requests: read # pull_request イベントで PR のコミット一覧を取得するために必要

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 未指定だと action に組み込まれた固定版を使い、日次実行でもルールが更新されない
          GITLEAKS_VERSION: latest
