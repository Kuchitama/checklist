name: Secret scan

# 秘密情報の混入を検出する（docs/security.md）。全履歴を対象にするため fetch-depth: 0。
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # 毎日 04:17 UTC。ルール更新で過去の履歴を再検査する

permissions:
  contents: read
  pull-requests: read # pull_request イベントで PR のコミット一覧を取得するために必要

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # 個人アカウントのリポジトリではライセンスキー不要（2026-10-23 確認: gitleaks/gitleaks-action README）
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
